<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@500;700&display=block">
<style>
  /* 1200x630 link preview. Same paper-party look as the site; deliberately neutral so it never hints at the answer. */
  :root { --bg: #f7f4fa; --dot: #e3daf0; --ink: #2a2440; --muted: #5f5976; --gold: #f2b84b; --boy: #2d64d2; --girl: #cc3d70; }
  html, body { margin: 0; }
  .banner {
    position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    background: radial-gradient(var(--dot) 2.5px, transparent 2.6px) 0 0 / 30px 30px, var(--bg);
    font-family: "Outfit", sans-serif; color: var(--ink);
    display: grid; place-content: center; justify-items: center; text-align: center; gap: 22px;
  }
  .bunting { position: absolute; top: 0; left: 0; width: 1200px; height: 110px; }
  .sticker {
    margin: 40px 0 0; padding: 10px 28px; border-radius: 999px; background: var(--gold);
    border: 4px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    font-weight: 700; font-size: 30px; transform: rotate(-3deg);
  }
  h1 { margin: 0; font: 400 150px/1 "Bagel Fat One", sans-serif; }
  h1 span { display: inline-block; text-shadow: 7px 7px 0 var(--ink); }
  h1 .boy { color: var(--boy); transform: rotate(-4deg); }
  h1 .girl { color: var(--girl); transform: rotate(3deg); }
  h1 .or { font: 700 56px "Outfit", sans-serif; color: var(--muted); text-shadow: none; padding-inline: 18px; vertical-align: middle; }
  h1 .q { color: var(--ink); text-shadow: none; }
  .sub { margin: 0; font-size: 36px; font-weight: 700; }
  .pill {
    display: inline-flex; align-items: center; gap: 14px; margin-top: 6px; padding: 12px 30px; border-radius: 999px;
    background: #fff; border: 4px solid var(--ink); box-shadow: 0 7px 0 var(--ink); font-size: 30px; font-weight: 700;
  }
  .pill i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: var(--gold); }
  .balloon { position: absolute; width: 150px; }
  .balloon.left { left: 70px; top: 190px; rotate: -10deg; }
  .balloon.right { right: 70px; top: 170px; rotate: 10deg; }
  .gift { position: absolute; width: 130px; right: 190px; bottom: 26px; rotate: 8deg; }
  .gift2 { position: absolute; width: 110px; left: 200px; bottom: 30px; rotate: -8deg; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <svg class="bunting" id="bunting" viewBox="0 0 1200 110"></svg>

  <svg class="balloon left" viewBox="0 0 60 130">
    <path d="M30 72c-6 18 8 30 0 56" fill="none" stroke="#2a2440" stroke-width="2"/>
    <ellipse cx="30" cy="36" rx="26" ry="32" fill="#2d64d2" stroke="#2a2440" stroke-width="3"/>
    <path d="M25 67h10l-5 6z" fill="#2d64d2" stroke="#2a2440" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="20" cy="24" rx="5" ry="10" fill="#fff" fill-opacity=".55" transform="rotate(-20 20 24)"/>
  </svg>
  <svg class="balloon right" viewBox="0 0 60 130">
    <path d="M30 72c6 18-8 30 0 56" fill="none" stroke="#2a2440" stroke-width="2"/>
    <ellipse cx="30" cy="36" rx="26" ry="32" fill="#cc3d70" stroke="#2a2440" stroke-width="3"/>
    <path d="M25 67h10l-5 6z" fill="#cc3d70" stroke="#2a2440" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="20" cy="24" rx="5" ry="10" fill="#fff" fill-opacity=".55" transform="rotate(-20 20 24)"/>
  </svg>
  <svg class="gift" viewBox="0 0 64 64">
    <rect x="10" y="28" width="44" height="28" rx="3" fill="#2d64d2" stroke="#2a2440" stroke-width="2.5"/>
    <rect x="7" y="20" width="50" height="10" rx="3" fill="#cc3d70" stroke="#2a2440" stroke-width="2.5"/>
    <rect x="29" y="20" width="6" height="36" fill="#f2b84b" stroke="#2a2440" stroke-width="2"/>
    <path d="M32 20c-6-10-16-8-12-2 2 3 8 2 12 2zM32 20c6-10 16-8 12-2-2 3-8 2-12 2z" fill="#f2b84b" stroke="#2a2440" stroke-width="2"/>
    <text x="32" y="49" text-anchor="middle" font-size="14" font-family="Bagel Fat One, sans-serif" fill="#fff">?</text>
  </svg>
  <svg class="gift2" viewBox="0 0 64 64">
    <rect x="10" y="28" width="44" height="28" rx="3" fill="#cc3d70" stroke="#2a2440" stroke-width="2.5"/>
    <rect x="7" y="20" width="50" height="10" rx="3" fill="#2d64d2" stroke="#2a2440" stroke-width="2.5"/>
    <rect x="29" y="20" width="6" height="36" fill="#f2b84b" stroke="#2a2440" stroke-width="2"/>
    <path d="M32 20c-6-10-16-8-12-2 2 3 8 2 12 2zM32 20c6-10 16-8 12-2-2 3-8 2-12 2z" fill="#f2b84b" stroke="#2a2440" stroke-width="2"/>
    <text x="32" y="49" text-anchor="middle" font-size="14" font-family="Bagel Fat One, sans-serif" fill="#fff">?</text>
  </svg>

  <p class="sticker">Romaica + Larry's baby</p>
  <h1><span class="boy">Boy</span><span class="or">or</span><span class="girl">Girl</span><span class="q">?</span></h1>
  <p class="sub">Pick your team and scratch the card to find out!</p>
  <span class="pill"><i></i>Party: Sat, Nov 21 · 5 PM</span>
</div>
<script>
  const N = 21, fills = ["#2d64d2", "#f2b84b", "#cc3d70"];
  let svg = '<path d="M0 8Q600 70 1200 8" fill="none" stroke="#2a2440" stroke-width="3"/>';
  for (let i = 0; i < N; i++) {
    const t = (i + .5) / N, x = 1200 * t, y = 8 + 124 * t * (1 - t);
    svg += `<polygon points="${x - 20},${y} ${x + 20},${y} ${x},${y + 40}" fill="${fills[i % 3]}" stroke="#2a2440" stroke-width="3" stroke-linejoin="round"/>`;
  }
  document.getElementById("bunting").innerHTML = svg;
</script>
</body>
</html>
